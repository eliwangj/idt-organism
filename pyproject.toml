[project]
name = "idt-organism"
version = "0.1.0"
description = "Phase 0 model organism for Instrumental Differential Treatment (IDT): a prompted organism, a matched control, and a preregistered divergence test."
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.66",
    "numpy>=1.26",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Generation runs locally; the analysis stack alone doesn't need torch.
local = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
